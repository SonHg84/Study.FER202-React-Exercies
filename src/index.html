<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Test</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Tùy chỉnh màu nền và viền cho phần lưới giống hệt ảnh */
        .grid-box {
            border: 1px solid #888;
            background-color: #d3d3d3; /* Màu xám cho các cột */
            padding: 10px 15px;
        }
        
        /* Chỉnh lại border để không bị viền đôi (double border) khi các cột đứng cạnh nhau */
        .row.g-0 > div {
            border: 1px solid #888;
            margin-top: -1px; /* Kéo lên 1px để đè viền ngang */
            margin-left: -1px; /* Kéo sang trái 1px để đè viền dọc */
        }

        .header-box {
            background-color: #e9ecef;
            padding: 40px;
            margin-bottom: 30px;
        }

        .footer-box {
            background-color: #d1c4c4; /* Màu nền ngả hồng/nâu nhạt */
            padding: 10px;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    
    <!-- 1. Phần Header -->
    <div class="header-box rounded-1">
        <h2>Let's test the grid!</h2>
    </div>

    <!-- 2. Phần Grid System -->
    <!-- Thêm class g-0 vào thẻ row để xóa khoảng trống (gutter) mặc định giữa các cột -->
    
    <!-- Hàng 1 -->
    <div class="row g-0">
        <div class="col-8 grid-box">First col</div>
        <div class="col-4 grid-box">Second col</div>
    </div>
    
    <!-- Hàng 2 -->
    <div class="row g-0">
        <div class="col-4 grid-box">col</div>
        <div class="col-4 grid-box">col</div>
        <div class="col-4 grid-box">col</div>
    </div>
    
    <!-- Hàng 3 -->
    <div class="row g-0">
        <div class="col-3 grid-box">col</div>
        <div class="col-3 grid-box">col</div>
        <div class="col-3 grid-box">col</div>
        <div class="col-3 grid-box">col</div>
    </div>

    <!-- 3. Phần Footer -->
    <div class="footer-box rounded-1">
        <strong>Created by ABC!</strong>
    </div>

</div>

<!-- Nhúng Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
