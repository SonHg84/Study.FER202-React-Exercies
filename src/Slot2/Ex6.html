<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1.Create website with bootstrap 5 as image below</title>

    <link
      rel="stylesheet"
      href="/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <style>
      /* Tùy chỉnh màu sắc và định dạng giá tiền */
      .old-price {
        text-decoration: line-through;
        color: #6c757d;
        font-size: 0.85rem;
      }
      .new-price {
        color: #fd7e14;
        font-weight: bold;
        font-size: 0.95rem;
      }
      /* CSS cho dải băng "Sale" chéo góc */
      .ribbon-wrapper {
        position: absolute;
        top: 0;
        right: 0;
        width: 100px;
        height: 100px;
        overflow: hidden;
        z-index: 1;
      }
      .ribbon {
        position: absolute;
        top: 15px;
        right: -30px;
        background-color: #fd7e14;
        color: white;
        padding: 5px 40px;
        transform: rotate(45deg);
        font-weight: bold;
        font-size: 0.85rem;
        text-align: center;
      }
      /* Tùy chỉnh nút giỏ hàng */
      .btn-cart {
        background-color: #4a76a8;
        color: white;
        border-radius: 0;
      }
      .btn-cart:hover {
        background-color: #3b5f87;
        color: white;
      }
      .btn-detail {
        border-radius: 0;
        border-color: #ced4da;
        color: #6c757d;
      }
    </style>
  </head>

    <!-- 1. Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-muted" href="#">Link</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-muted" href="#">Dropdown</a>
            </li>
          </ul>
          <form class="d-flex">
            <input
              class="form-control me-2 rounded-0"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-primary rounded-0" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- 2. Hero Banner / Carousel Slider Placeholder -->
    <div class="container-fluid p-0 mb-5">
      <div
        class="bg-secondary text-white d-flex justify-content-center align-items-center position-relative"
        style="height: 400px; width: 100%"
      >
        <!-- Các nút điều hướng mô phỏng -->
        <i
          class="bi bi-chevron-left position-absolute start-0 ms-4 fs-1 text-light opacity-50"
        ></i>
        <h1 class="display-3 opacity-50">1920 x 530</h1>
        <i
          class="bi bi-chevron-right position-absolute end-0 me-4 fs-1 text-light opacity-50"
        ></i>

        <!-- Các chỉ thị (indicators) mô phỏng -->
        <div class="position-absolute bottom-0 mb-3 d-flex gap-2">
          <div style="width: 30px; height: 3px; background-color: white"></div>
          <div
            style="
              width: 30px;
              height: 3px;
              background-color: rgba(255, 255, 255, 0.5);
            "
          ></div>
          <div
            style="
              width: 30px;
              height: 3px;
              background-color: rgba(255, 255, 255, 0.5);
            "
          ></div>
        </div>
      </div>
    </div>
